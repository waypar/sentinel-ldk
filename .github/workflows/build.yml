name: Build test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Probe Sentinel SDK version
      id: probe_sentinel_sdk
      shell: bash
      run: ./scripts/download-sentinel-sdk.sh ${{ matrix.platform }} --probe-only
    - name: Cache Sentinel LDK SDK
      uses: actions/cache@v5
      with:
        path: vendor/cache/${{ matrix.platform }}
        key: sentinel-ldk-${{ matrix.platform }}-${{ steps.probe_sentinel_sdk.outputs.cache_tag }}
    - name: Download Sentinel SDK
      shell: bash
      run: ./scripts/download-sentinel-sdk.sh ${{ matrix.platform }}
    - name: Install Sentinel SDK (Linux)
      if: runner.os == 'Linux'
      run: ./scripts/install-sentinel-linux.sh
    - name: Install Sentinel SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/install-sentinel-windows.ps1
    - name: Rust Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Clippy
      run: cargo clippy --verbose
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
